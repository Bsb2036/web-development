<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A small gallery of Hollis's drawings and artwork.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="hollis.css">
    <title>Hollis's Fine Art</title>
</head>
<body>
    <header class="site-header">
        <p class="brand">Hollis's Fine Art</p>
    </header>

    <main>
        <section class="intro">
            <p class="eyebrow">A GALLERY OF ORIGINAL ART</p>
            <h1>Hollis's Fine Art</h1>
            <p>Big ideas, brave lines, and a little imagination in every drawing.</p>
        </section>

        <section class="gallery" aria-label="Hollis's artwork">
            <figure class="art-card">
                <img src="images/hollis-art-1.jpg" alt="Hollis holding a pencil drawing of a snake" loading="lazy">
                <figcaption>
                    <h2>Snake Study</h2>
                    <p>A close-up pencil drawing full of texture and detail.</p>
                </figcaption>
            </figure>

            <figure class="art-card">
                <img src="images/hollis-art-2.jpg" alt="Pencil drawing of a spotted big cat with its mouth open" loading="lazy">
                <figcaption>
                    <h2>Wild Cat</h2>
                    <p>A bold big-cat portrait, drawn in graphite.</p>
                </figcaption>
            </figure>

            <figure class="art-card">
                <img src="images/hollis-art-3.jpg" alt="Pencil sketch of a playful cartoon animal" loading="lazy">
                <figcaption>
                    <h2>Playful Character</h2>
                    <p>A lively character sketch with expressive lines.</p>
                </figcaption>
            </figure>

            <figure class="art-card">
                <img src="images/hollis-art-4.jpg" alt="Pencil drawing of a wide-eyed anime-inspired character" loading="lazy">
                <figcaption>
                    <h2>Wide-Eyed Character</h2>
                    <p>A charming character portrait with big, bright eyes.</p>
                </figcaption>
            </figure>
        </section>
    </main>

    <footer class="site-footer">
        <p>Made with imagination by Hollis.</p>
    </footer>
</body>
</html>
